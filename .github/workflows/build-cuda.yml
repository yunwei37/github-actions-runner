name: Build CUDA Actions runner image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yunwei37/github-actions-runner
  TAG: ubuntu-slim-20260728.2-runner-2.336.0-cuda-12.9-llvm-18-r1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out image source
        uses: actions/checkout@v7

      - name: Free disk space for the CUDA toolkit
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the GPU runner
        run: |
          docker build \
            --file Dockerfile.cuda \
            --label org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            --tag "${IMAGE}:${TAG}" \
            .

      - name: Verify the toolchain
        run: |
          docker run --rm --entrypoint bash "${IMAGE}:${TAG}" -lc \
            'nvcc --version && llvm-config --version && clang --version | head -1 && cmake --version | head -1'

      - name: Publish the immutable runner image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:${TAG}"
          docker inspect "${IMAGE}:${TAG}" --format 'image={{index .RepoDigests 0}}' >> "${GITHUB_STEP_SUMMARY}"
