# eunomia-bpf CI guest kernel: options on top of Kata's debug kernel that the
# CI jobs need and Kata's kernels leave out.
# process_vm_readv/process_vm_writev (bpftime's checked probe reads and writes)
CONFIG_CROSS_MEMORY_ATTACH=y
# /proc/<pid>/map_files, kcmp and other process-introspection interfaces
CONFIG_CHECKPOINT_RESTORE=y
